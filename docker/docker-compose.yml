version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: truerefurb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: truerefurb
      POSTGRES_PASSWORD: truerefurb_secret
      POSTGRES_DB: truerefurb_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truerefurb -d truerefurb_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: truerefurb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: truerefurb-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://truerefurb:truerefurb_secret@postgres:5432/truerefurb_db?schema=public
      NODE_ENV: production
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: truerefurb-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
